<!DOCTYPE html>
<html>
<head>
    <title>Emotion Detector</title>
</head>

<body>
    <h1>Emotion Detector</h1>

    <p>Enter a sentence below:</p>

    <input
        type="text"
        id="textToAnalyze"
        placeholder="Enter text here"
        style="width: 300px; padding: 10px;"
    >

    <button
        onclick="runEmotionDetection()"
        style="padding: 10px;"
    >
        Analyze
    </button>

    <h3>Result:</h3>
    <div id="system_response"></div>

    <script>
        function runEmotionDetection() {
            const text = document.getElementById("textToAnalyze").value;

            fetch("/emotionDetector?textToAnalyze=" + encodeURIComponent(text))
                .then(response => response.text())
                .then(data => {
                    document.getElementById("system_response").innerText = data;
                });
        }
    </script>
</body>
</html>
